<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retailer Inventory</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        input[type="number"] {
            width: 60px;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #message {
            margin-bottom: 15px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>
    <h1>Retailer Inventory</h1>
    <div id="message"></div>
    <table id="inventoryTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price (₹)</th>
                <th>Available Qty</th>
                <th>Category</th>
                <th>Order Qty</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <a href="cart.html">Go to Cart 🛒</a>

    <script>
        const retailerId = localStorage.getItem("retailer_id") || 5;
        const inventoryTableBody = document.querySelector("#inventoryTable tbody");
        const messageDiv = document.getElementById("message");

        let products = [];

        async function loadProducts() {
            try {
                const res = await fetch(`http://127.0.0.1:8000/customer/products/${retailerId}`);
                if (!res.ok) throw new Error(`Failed to fetch products: ${res.status}`);
                products = await res.json();
                renderProducts();
            } catch (err) {
                messageDiv.style.color = "red";
                messageDiv.textContent = err.message;
            }
        }

        function renderProducts() {
            inventoryTableBody.innerHTML = "";
            products.forEach((p, idx) => {
                inventoryTableBody.innerHTML += `
          <tr>
            <td>${p.name}</td>
            <td>${p.price.toFixed(2)}</td>
            <td id="availQty-${idx}">${p.quantity}</td>
            <td>${p.category}</td>
            <td><input type="number" id="orderQty-${idx}" min="1" max="${p.quantity}" value="1" ${p.quantity === 0 ? 'disabled' : ''} /></td>
            <td><button onclick="addToCart(${idx}, this)" ${p.quantity === 0 ? 'disabled' : ''}>Add to Cart</button></td>
          </tr>
        `;
            });
        }

        async function addToCart(idx, button) {
            const product = products[idx];
            const qtyInput = document.getElementById(`orderQty-${idx}`);
            const qty = parseInt(qtyInput.value);

            if (isNaN(qty) || qty < 1) {
                alert("Please enter a valid quantity (1 or more).");
                return;
            }
            if (qty > product.quantity) {
                alert(`Cannot order more than available quantity (${product.quantity}).`);
                return;
            }

            // Optimistic frontend update
            product.quantity -= qty;
            document.getElementById(`availQty-${idx}`).textContent = product.quantity;

            if (product.quantity === 0) {
                qtyInput.value = 0;
                qtyInput.disabled = true;
                button.disabled = true;
            }

            // Update cart in localStorage
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const existingIndex = cart.findIndex(item => item.product === product.name && item.retailer_id == retailerId);

            if (existingIndex !== -1) {
                cart[existingIndex].quantity += qty;
            } else {
                cart.push({
                    retailer_id: retailerId,
                    product: product.name,
                    price: product.price,
                    quantity: qty
                });
            }

            localStorage.setItem("cart", JSON.stringify(cart));
            alert(`${qty} x ${product.name} added to cart.`);
        }

        loadProducts();
    </script>
</body>

</html>
